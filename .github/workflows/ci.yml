name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

jobs:
  cuda-build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Verify CUDA toolchain
        run: nvcc --version

      - name: Build cuda-matmul
        run: make -C cuda-matmul clean all

      - name: Smoke test
        run: ./cuda-matmul/matmul 256
